name: harvest
# Rebuild catalog.json from every repo carrying a githfield.yml manifest, then
# publish the board to GitHub Pages. The default GITHUB_TOKEN can read public
# repos across orgs (5000 req/hr). To scan private repos, set a GITHFIELD_PAT
# secret (fine-grained, read contents+issues on the scanned orgs) and it is used
# in preference to GITHUB_TOKEN below.
on:
  schedule:
    - cron: "17,47 * * * *"      # twice an hour, off the :00/:30 rush
  workflow_dispatch: {}
  repository_dispatch:
    types: [harvest]
  push:
    branches: [main]
    paths: ["scripts/**", "config.json", "index.html", "docs/**"]

permissions:
  contents: write     # commit the refreshed catalog.json; branch-based Pages serves it

concurrency:
  group: harvest
  cancel-in-progress: false   # let a running harvest finish so its catalog push isn't lost

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - name: Build catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHFIELD_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/harvest.mjs
      - name: Commit catalog if changed
        # Pages serves from the main branch (build_type: legacy), so committing the
        # refreshed catalog.json is the whole deploy. Rebase-retry in case a
        # concurrent run pushed first.
        run: |
          git config user.name  "githfield-bot"
          git config user.email "bot@githfield"
          git add catalog.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "harvest: refresh catalog.json"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break || sleep 3
          done
